name: Release

# Wydanie buduje GitHub Actions z DOKŁADNIE tego commita, na który wskazuje tag — nie laptop.
# Powody (wymogi katalogu Obsidiana):
#   * artifact attestations: użytkownik może kryptograficznie sprawdzić, że main.js/styles.css
#     powstały z tego repo i tego commita (actions/attest-build-provenance);
#   * powtarzalność: bundle budowany na Windows różnił się od zbudowanego na Linuksie
#     końcami linii w osadzonej notce wydania (esbuild.js to normalizuje, ale
#     jedno stałe środowisko builda zamyka temat na dobre);
#   * release ma zawierać WYŁĄCZNIE main.js, manifest.json i styles.css — nic więcej katalog
#     nie pobiera, a każdy dodatkowy plik walidator wytyka.
#
# Tag == manifest.version, znak w znak, BEZ litery `v` (wymóg katalogu — patrz RELEASE_PROCESS.md).

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write      # utworzenie wydania i wgranie assetów
  id-token: write      # podpis provenance (OIDC)
  attestations: write  # zapis atestacji przy repo

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # esbuild.js czyta DESTINATION_VAULTS przez process.loadEnvFile; w CI nie ma .env — ustawiamy jawnie.
      DESTINATION_VAULTS: ''
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Opublikowane wydanie jest NIEZMIENNE: użytkownicy i katalog mogli już pobrać jego pliki,
      # a atestacja opisuje dokładnie te bajty. Poprawka idzie w kolejnym numerze patch, tag
      # zostaje na miejscu. Sprawdzamy to NA STARCIE, żeby nie palić biegu na pewną odmowę.
      # Regułę trzyma jeden skrypt (komplet / przerwana publikacja / uszkodzone pliki / błąd
      # odczytu = odmowa) - ten sam woła krok publikacji na końcu.
      - name: opublikowane wydanie jest niezmienne
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/release-state.mjs "$TAG"

      - run: npm ci --no-audit --no-fund

      - name: tag == package.json == manifest.json, wpis w versions.json
        run: |
          node -e "
            const fs = require('fs');
            const tag = process.env.TAG;
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            const manifest = JSON.parse(fs.readFileSync('manifest.json', 'utf8'));
            const versions = JSON.parse(fs.readFileSync('versions.json', 'utf8'));
            const problems = [];
            if (pkg.version !== tag) problems.push('package.json=' + pkg.version + ' != tag=' + tag);
            if (manifest.version !== tag) problems.push('manifest.json=' + manifest.version + ' != tag=' + tag);
            if (!Object.prototype.hasOwnProperty.call(versions, tag)) problems.push('versions.json nie ma wpisu dla ' + tag);
            else if (versions[tag] !== manifest.minAppVersion) problems.push('versions.json[' + tag + ']=' + versions[tag] + ' != minAppVersion=' + manifest.minAppVersion);
            if (!fs.existsSync('releases/' + tag + '.md')) problems.push('brak releases/' + tag + '.md (notatki wydania)');
            if (problems.length) { console.error(problems.join('\n')); process.exit(1); }
            console.log('Wersja ' + tag + ' spójna (minAppVersion ' + manifest.minAppVersion + ')');
          "

      # Harness „Szklane Pudło" — prawdziwy plugin bootowany w Node bez Obsidiana. Mieszka
      # w OSOBNYM repo (https://github.com/JDHole/pkm-assistant-harness): walidator
      # katalogu Obsidiana lintuje CAŁE repo pluginu, a narzędzie testowe nie jest częścią
      # pluginu i generowało tysiące ostrzeżeń. Od 2026-09-11 mieszka tam też atrapa `obsidian`
      # + shim DOM + właściwy preload AVA (`test-support/`) — więc te dwa kroki MUSZĄ stanąć
      # PRZED `npm test`, dokładnie jak w ci.yml: lokator `test-support/register-obsidian-for-ava.mjs`
      # szuka checkoutu pod `.harness-ci`, a atrapa `obsidian.ts` importuje `yaml` z node_modules
      # TEGO checkoutu (bez `npm ci` niżej `npm test` pada na `Cannot find package 'yaml'`).
      # Wydanie 2.2.3 (pierwsza próba) obleciało dokładnie na tym: harness klonowany dopiero po bramkach.
      # Wydanie bierze harness z PRZYPIĘTEGO commita (.github/harness-sha), nie z ruchomego main:
      # ten sam tag zawsze przechodzi te same scenariusze, a podsumowanie biegu mówi, które.
      # Zwykłe CI (ci.yml) zostaje na main harnessu - tam chcemy najnowszych scenariuszy.
      - name: harness — przypięty commit
        id: harness
        run: |
          sha="$(tr -d '[:space:]' < .github/harness-sha)"
          if ! printf '%s' "$sha" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::.github/harness-sha musi zawierać pełny SHA commita harnessu (40 znaków hex), jest: '$sha'"
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Harness: JDHole/pkm-assistant-harness@$sha" >> "$GITHUB_STEP_SUMMARY"

      - name: harness — checkout osobnego repo
        uses: actions/checkout@v4
        with:
          repository: JDHole/pkm-assistant-harness
          ref: ${{ steps.harness.outputs.sha }}
          path: .harness-ci

      - name: harness — zależności
        run: npm ci --no-audit --no-fund
        working-directory: .harness-ci

      # Te same bramki co w ci.yml — wydanie nie ma prawa być mniej sprawdzone niż zwykły push.
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run lint:obsidian
      - run: npm run build
      - name: manifest i versions nietkniete przez build
        run: git diff --exit-code manifest.json versions.json

      # Harness już wyklonowany + `npm ci` wyżej. Tu tylko jego skrypty na TYM checkoucie
      # pluginu (PKM_ASSISTANT_ROOT).
      - name: harness — selftest
        run: npm run selftest
        working-directory: .harness-ci
        env:
          PKM_ASSISTANT_ROOT: ${{ github.workspace }}

      - name: harness — scenariusze
        run: npm run scenarios
        working-directory: .harness-ci
        env:
          PKM_ASSISTANT_ROOT: ${{ github.workspace }}

      - name: atestacja provenance assetów
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/main.js
            dist/manifest.json
            dist/styles.css

      - name: wydanie na GitHubie (tylko 3 pliki katalogu)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Stan liczony od nowa tuż przed publikacją (bramki trwały kilkanaście minut). Komplet,
          # uszkodzone pliki albo błąd odczytu kończą krok tutaj - skrypt wychodzi kodem 1.
          if ! stan="$(node .github/scripts/release-state.mjs "$TAG")"; then
            echo "$stan"
            exit 1
          fi
          case "$stan" in
            absent)
              gh release create "$TAG" dist/main.js dist/manifest.json dist/styles.css \
                --title "$TAG" \
                --notes-file "releases/$TAG.md" \
                --verify-tag
              ;;
            partial\ *)
              # Przerwana publikacja: dogrywamy tylko brakujące pliki, istniejących nie ruszamy.
              for f in ${stan#partial }; do
                gh release upload "$TAG" "dist/$f"
              done
              ;;
            *)
              echo "::error::Nieoczekiwany stan wydania: '$stan'"
              exit 1
              ;;
          esac
