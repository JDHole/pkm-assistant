name: "Feature Request"
description: "Suggest a feature or enhancement for the PKM Assistant plugin"
title: "[Feature]: <short description>"
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        ## Feature Request
        Thank you for helping improve the PKM Assistant plugin!
        Please fill out the form below to describe your feature request.
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem would this feature solve? Please be specific.
      placeholder: "e.g., It's hard to share one skill between several agents."
    validations:
      required: true
  - type: textarea
    id: desired
    attributes:
      label: Desired Solution
      description: Describe the feature or enhancement you would like to see.
      placeholder: "e.g., Let a skill template be assigned to multiple agents at once."
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Have you considered alternative solutions? If so, please describe them.
      placeholder: "e.g., I tried copying the skill manually, but the copies drift apart."
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Any other relevant information, screenshots, or mockups.
      placeholder: "Add any other context or screenshots about the feature request here."
    validations:
      required: false
